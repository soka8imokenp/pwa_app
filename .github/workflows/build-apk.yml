name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Web App
        run: pnpm build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Clear Gradle Cache
        run: |
          rm -rf ~/.gradle/caches/jars-* || true
          rm -rf ~/.gradle/caches/modules-2 || true
          rm -rf ~/.gradle/caches/build-cache-* || true

      - name: Build Android APK via Gradle
        working-directory: ./android
        run: ./gradlew clean assembleDebug --stacktrace --refresh-dependencies

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAIRO-Planner-app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
