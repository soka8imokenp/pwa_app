name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 platforms;android-35 build-tools;34.0.0 platform-tools'

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Web App
        run: pnpm build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Purge Gradle Cache
        run: rm -rf ~/.gradle && mkdir -p ~/.gradle

      - name: Build Android APK via Gradle
        working-directory: ./android
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon -Dorg.gradle.classloaderscope.cacheable=false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAIRO-Planner-app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
