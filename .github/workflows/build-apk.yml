name: Build & Publish Android APK

on:
  push:
    branches: [main, master]
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 platforms;android-35 build-tools;34.0.0 platform-tools'

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: Auto-Synchronize Version from Tag / Commit
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            CLEAN_VERSION="${RAW_TAG#v}"
            RAW_TAG="v${CLEAN_VERSION}"
          else
            CLEAN_VERSION=$(node -p "require('./package.json').version")
            RAW_TAG="v${CLEAN_VERSION}"
          fi
          
          echo "Automated build version: $RAW_TAG ($CLEAN_VERSION)"
          echo "RELEASE_TAG=$RAW_TAG" >> $GITHUB_ENV
          echo "RELEASE_NAME=Daily Sumire $RAW_TAG" >> $GITHUB_ENV
          
          # 1. Sync package.json
          node -e "const p=require('./package.json'); p.version='${CLEAN_VERSION}'; require('fs').writeFileSync('./package.json', JSON.stringify(p,null,2));"
          
          # 2. Sync android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${CLEAN_VERSION}\"/" android/app/build.gradle

      - name: Build Web App
        run: pnpm build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Purge Gradle Cache
        run: rm -rf ~/.gradle && mkdir -p ~/.gradle

      - name: Build Android APK via Gradle
        working-directory: ./android
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon -Dorg.gradle.classloaderscope.cacheable=false

      - name: Prepare APK Files for Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Sumire-app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk app-release.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Sumire-app-debug.apk
          path: |
            Daily-Sumire-app-debug.apk
            app-release.apk

      - name: Generate Dynamic Release Notes
        run: |
          LATEST_MSG=$(git log -1 --pretty=format:"%s%n%n%b" | head -n 15)
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "### 🚀 Release $RELEASE_TAG" >> $GITHUB_ENV
          echo "$LATEST_MSG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          make_latest: true
          generate_release_notes: true
          body: ${{ env.RELEASE_BODY }}
          files: |
            Daily-Sumire-app-debug.apk
            app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
