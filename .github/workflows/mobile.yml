name: Native App (Kotlin Multiplatform)

on:
  push:
    branches: [kotlin-kmp]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  android:
    name: Android – tests & APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.SUMIRE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SUMIRE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Unit tests + build
        env:
          SUMIRE_KEYSTORE_PASSWORD: ${{ secrets.SUMIRE_KEYSTORE_PASSWORD }}
          SUMIRE_KEY_ALIAS: ${{ secrets.SUMIRE_KEY_ALIAS }}
          SUMIRE_KEY_PASSWORD: ${{ secrets.SUMIRE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :composeApp:testDebugUnitTest :composeApp:assembleDebug :composeApp:assembleRelease \
            -PappVersionCode=$((200 + GITHUB_RUN_NUMBER)) -PappVersionName=2.0.${GITHUB_RUN_NUMBER} \
            --stacktrace --no-configuration-cache 2>&1 | tee build.log

      - name: Report compiler errors
        if: failure()
        run: |
          # Collect Kotlin/Gradle errors into a single annotation (readable via the public check-runs API).
          ERR=$(grep -E '^e: |error:|FAILURE|What went wrong|\.kt:[0-9]+:[0-9]+ |AAPT|Execution failed|Could not resolve|> ' build.log | grep -v '^> Task' | head -n 120)
          ERR="${ERR//'%'/'%25'}"
          ERR="${ERR//$'\n'/'%0A'}"
          ERR="${ERR//$'\r'/'%0D'}"
          echo "::error title=Gradle build failed::${ERR}"
          # Test failures
          for f in $(find composeApp/build/test-results -name '*.xml' 2>/dev/null); do
            if grep -q '<failure' "$f"; then
              T=$(grep -A3 '<failure' "$f" | head -n 30)
              T="${T//'%'/'%25'}"; T="${T//$'\n'/'%0A'}"
              echo "::error title=Test failure $(basename $f)::${T}"
            fi
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-build-log
          path: mobile/build.log

      - name: Collect APKs
        run: |
          mkdir -p ../dist
          cp composeApp/build/outputs/apk/release/*.apk ../dist/DailySumire-native.apk
          cp composeApp/build/outputs/apk/debug/*.apk ../dist/DailySumire-native-debug.apk
          ls -la ../dist

      - uses: actions/upload-artifact@v5
        with:
          name: DailySumire-native-apk
          path: dist/*.apk

      - name: Publish preview release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kmp-preview
          name: Daily Sumire Native (preview build ${{ github.run_number }})
          prerelease: true
          make_latest: false
          body: |
            Native Kotlin Multiplatform build from `${{ github.ref_name }}` @ ${{ github.sha }}.
            - `DailySumire-native-debug.apk` – package `com.kairo.planner.dev`, installs **next to** the current app. Use this one for testing.
            - `DailySumire-native.apk` – optimized build with the production package `com.kairo.planner`. It is signed with a different key than the old Capacitor app, so Android will ask to uninstall the old app first – export your data in the old app before doing that.
          files: |
            dist/DailySumire-native.apk
            dist/DailySumire-native-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios:
    name: iOS – shared code compiles
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile iOS framework
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-configuration-cache 2>&1 | tee build.log
      - name: Report compiler errors
        if: failure()
        run: |
          ERR=$(grep -E '^e: |error:|What went wrong|Execution failed|Could not resolve' build.log | head -n 80)
          ERR="${ERR//'%'/'%25'}"; ERR="${ERR//$'\n'/'%0A'}"
          echo "::error title=iOS build failed::${ERR}"
