<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimalist Neo-Brutalist Background Canvas -->
  <rect width="512" height="512" fill="#FFE873"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="#FAF7F2" stroke="#18181B" stroke-width="16"/>

  <!-- Minimalist Japanese Vector Bunny Ears -->
  <!-- Left Ear -->
  <g transform="rotate(-6 210 170)">
    <rect x="180" y="80" width="52" height="155" rx="26" fill="#E8DCFF" stroke="#18181B" stroke-width="12"/>
    <rect x="194" y="105" width="24" height="95" rx="12" fill="#FED7AA" stroke="#18181B" stroke-width="5"/>
  </g>
  <!-- Right Ear -->
  <g transform="rotate(6 302 170)">
    <rect x="280" y="80" width="52" height="155" rx="26" fill="#E8DCFF" stroke="#18181B" stroke-width="12"/>
    <rect x="294" y="105" width="24" height="95" rx="12" fill="#FED7AA" stroke="#18181B" stroke-width="5"/>
  </g>

  <!-- Minimalist Head Container -->
  <rect x="146" y="205" width="220" height="195" rx="56" fill="#FFFFFF" stroke="#18181B" stroke-width="14"/>

  <!-- Lavender Bangs Cap -->
  <path d="M146 265 C170 220 342 220 366 265 C336 240 305 268 285 244 C265 272 245 272 225 244 C205 268 174 240 146 265 Z" fill="#C084FC" stroke="#18181B" stroke-width="10"/>

  <!-- Ultra-Minimalist Fern Deadpan Gaze -->
  <!-- Left Eye -->
  <g>
    <path d="M182 300 Q206 288 230 300" stroke="#18181B" stroke-width="9" stroke-linecap="round"/>
    <rect x="196" y="306" width="16" height="12" rx="6" fill="#10B981" stroke="#18181B" stroke-width="4.5"/>
    <circle cx="202" cy="310" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Right Eye -->
  <g>
    <path d="M282 300 Q306 288 330 300" stroke="#18181B" stroke-width="9" stroke-linecap="round"/>
    <rect x="300" y="306" width="16" height="12" rx="6" fill="#10B981" stroke="#18181B" stroke-width="4.5"/>
    <circle cx="306" cy="310" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Minimalist Line Mouth -->
  <line x1="246" y1="352" x2="266" y2="352" stroke="#18181B" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Soft Blush -->
  <ellipse cx="174" cy="328" rx="10" ry="6" fill="#FCA5A5" opacity="0.6"/>
  <ellipse cx="338" cy="328" rx="10" ry="6" fill="#FCA5A5" opacity="0.6"/>
