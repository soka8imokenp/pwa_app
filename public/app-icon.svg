<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimalist Neo-Brutalist Cream Canvas -->
  <rect width="512" height="512" fill="#FAF7F2"/>
  
  <!-- Outer Neo-Brutalist Rounded Squircle Frame -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="#FFE873" stroke="#18181B" stroke-width="16"/>
  <rect x="52" y="52" width="408" height="408" rx="80" fill="#FAF7F2" stroke="#18181B" stroke-width="6"/>

  <!-- Minimalist Geometric Rabbit Ears -->
  <!-- Left Ear -->
  <g transform="rotate(-8 200 160)">
    <rect x="160" y="70" width="56" height="150" rx="28" fill="#E8DCFF" stroke="#18181B" stroke-width="12"/>
    <rect x="174" y="95" width="28" height="95" rx="14" fill="#FED7AA" stroke="#18181B" stroke-width="6"/>
  </g>
  <!-- Right Ear -->
  <g transform="rotate(8 312 160)">
    <rect x="296" y="70" width="56" height="150" rx="28" fill="#E8DCFF" stroke="#18181B" stroke-width="12"/>
    <rect x="310" y="95" width="28" height="95" rx="14" fill="#FED7AA" stroke="#18181B" stroke-width="6"/>
  </g>

  <!-- Minimalist Head / Face Container -->
  <rect x="136" y="195" width="240" height="210" rx="60" fill="#FFFFFF" stroke="#18181B" stroke-width="14"/>

  <!-- Lavender Bangs Header Cap -->
  <path d="M136 260 C160 210 352 210 376 260 C340 235 305 265 285 240 C265 270 240 270 220 240 C200 265 168 235 136 260 Z" fill="#C084FC" stroke="#18181B" stroke-width="10"/>

  <!-- Iconic Deadpan Fern Eyes (Minimalist Neo-Brutalist Geometry) -->
  <!-- Left Eye -->
  <g>
    <path d="M175 295 Q205 280 232 295" stroke="#18181B" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="203" cy="308" rx="15" ry="14" fill="#10B981" stroke="#18181B" stroke-width="6"/>
    <circle cx="203" cy="308" rx="7" fill="#064E3B"/>
    <circle cx="199" cy="303" r="3" fill="#FFFFFF"/>
    <path d="M185 318 Q203 324 220 318" stroke="#18181B" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Right Eye -->
  <g>
    <path d="M280 295 Q307 280 337 295" stroke="#18181B" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="309" cy="308" rx="15" ry="14" fill="#10B981" stroke="#18181B" stroke-width="6"/>
    <circle cx="309" cy="308" rx="7" fill="#064E3B"/>
    <circle cx="305" cy="303" r="3" fill="#FFFFFF"/>
    <path d="M292 318 Q309 324 327 318" stroke="#18181B" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Minimalist Line Mouth -->
  <line x1="242" y1="350" x2="270" y2="350" stroke="#18181B" stroke-width="6" stroke-linecap="round"/>

  <!-- Soft Pink Blush Dots -->
  <circle cx="168" cy="326" r="10" fill="#FCA5A5" opacity="0.6"/>
  <circle cx="344" cy="326" r="10" fill="#FCA5A5" opacity="0.6"/>
</svg>
